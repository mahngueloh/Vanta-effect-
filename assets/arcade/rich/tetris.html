<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;overscroll-behavior:none;padding:0}
body{padding:8px;background:radial-gradient(circle at 50% 12%,#4a154b,#110419 60%,#05000a)}
.machine{position:relative;overflow:hidden;padding:12px;border:3px solid #360d3d;border-radius:22px;background:linear-gradient(105deg,#15021f,#501366 8%,#230530 20%,#460e59 52%,#1b0324 82%,#6a1c87 94%,#0f0117);box-shadow:inset 0 0 0 2px #ff4081,inset 0 0 0 6px #240530,inset 0 20px 35px #00e5ff22,0 8px 0 #15021f,0 14px 24px #000c;touch-action:none}
.machine:before{content:"";position:absolute;inset:6px;border:2px solid #ff4081;border-radius:18px;pointer-events:none;box-shadow:inset 0 0 11px #00e5ff}
.lights{height:8px;margin:0 12px 6px;border:2px solid #360d3d;border-radius:8px;background:repeating-radial-gradient(circle at 6px 50%,#fff 0 2px,#00e5ff 3px 5px,#ff4081 6px 12px);box-shadow:0 0 12px #ff4081;animation:lights .55s steps(2) infinite}
.title{padding:8px 4px 6px;border:2px solid #ff4081;border-radius:12px;color:#fff;background:radial-gradient(ellipse at 50% 0,#00e5ff,#4a154b 70%);box-shadow:inset 0 0 0 3px #230530,inset 0 -11px 18px #000d,0 4px 0 #15021f;text-align:center;font:bold 22px Impact,Arial Black,sans-serif;letter-spacing:2px;text-shadow:0 2px #15021f}
.stats{display:flex;margin:8px 2px;padding:4px;border:2px solid #6a1c87;border-radius:8px;background:linear-gradient(#15021f,#05000a);box-shadow:inset 0 0 9px #000,0 3px 0 #230530}
.stat{flex:1;border-right:1px solid #6a1c87;color:#e1bee7;text-align:center;font:bold 10px monospace}.stat:last-child{border:0}.stat b{display:block;margin-top:2px;color:#00e5ff;font-size:14px;text-shadow:0 0 6px #00e5ff}
.frame{position:relative;padding:6px;border:4px solid #501366;border-radius:14px;background:linear-gradient(90deg,#15021f,#ff4081 5%,#230530 10%,#230530 90%,#ff4081 95%,#15021f);box-shadow:inset 0 0 0 3px #05000a,0 4px 0 #15021f,0 8px 15px #000b}
.reelbox{height:330px;border:3px solid #05000a;border-radius:9px;background:#1a1a2e;overflow:hidden;position:relative}
.reelbox canvas{display:block;width:100%;height:100%;touch-action:none}
.message{height:30px;margin:8px 2px 6px;display:grid;place-items:center;border:2px solid #6a1c87;border-radius:8px;color:#00e5ff;background:#15021f;text-align:center;font:bold 13px monospace;text-shadow:0 0 7px #00e5ff}
.ctrls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;margin:0 2px;padding:6px;border:3px solid #501366;border-radius:12px;background:linear-gradient(#4a154b,#110419);box-shadow:inset 0 2px #ff4081,0 5px #15021f,0 9px 12px #0008}
button{height:46px;border:2px solid #ff4081;border-radius:10px;color:#fff;font-weight:900;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;font-size:16px}
.btn-dir{background:linear-gradient(#7b1fa2,#4a148c);box-shadow:inset 0 2px 4px #e1bee7,0 3px #230530}
.btn-boost{background:radial-gradient(circle at 50% 32%,#ff4081,#c2185b 60%,#880e4f);box-shadow:inset 0 2px 5px #ff80ab,0 3px #880e4f;text-shadow:0 1px 3px #000}
.over{position:absolute;z-index:10;inset:0;display:none;place-items:center;text-align:center;color:#fff;background:#05000af2}.over.on{display:grid}
.over button{padding:0 24px;margin-top:12px;background:#00e5ff;color:#000;border:none}
@keyframes lights{50%{filter:brightness(1.8)}}

.ctrls.one{grid-template-columns:1fr}.ctrls.four{grid-template-columns:repeat(4,1fr)}
.ctrls.five{grid-template-columns:repeat(5,1fr)}button{font-size:18px}
</style></head><body>
<div class="machine">
<div class="lights"></div>
<div class="title">TETRIS</div>
<div class="stats"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">LINES<b id="ln">0</b></div><div class="stat">LEVEL<b id="lv">1</b></div><div class="stat">BEST<b id="bs">0</b></div></div>
<div class="frame"><div class="reelbox"><canvas id="gc"></canvas></div></div>
<div class="message" id="msg">TAP BUTTONS OR SWIPE</div>
<div class="ctrls five">
<button id="l" class="btn-dir" type="button">◀</button><button id="rt" class="btn-boost" type="button">⟳</button><button id="r" class="btn-dir" type="button">▶</button><button id="d" class="btn-dir" type="button">▼</button><button id="hd" class="btn-boost" type="button">⤓</button>
</div>
<div class="over" id="over"><div><h2>GAME OVER</h2><div id="fs" style="font-size:16px;font-weight:bold;margin-bottom:8px"></div><button id="rb" type="button">PLAY AGAIN</button></div></div>
</div>
<script>(()=>{
const $=i=>document.getElementById(i);
const c=$("gc"),x=c.getContext("2d"),box=c.parentElement,over=$("over"),msg=$("msg");
const scEl=$("sc"),lnEl=$("ln"),lvEl=$("lv"),bsEl=$("bs"),fs=$("fs");
const COLS=10,ROWS=20;
const COL=["#00e5ff","#ffd600","#ab47bc","#69f0ae","#ff5252","#448aff","#ff9100"];
const SH=[[[0,1],[1,1],[2,1],[3,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[0,1],[1,1]],[[0,0],[1,0],[1,1],[2,1]],[[0,0],[0,1],[1,1],[2,1]],[[2,0],[0,1],[1,1],[2,1]]];
let W,H,cs,ox,oy,g,cur,nxt,score,lines,level,best=0,alive=false,drop=0,last=0,bag=[];
try{best=Number(localStorage.getItem("tetris_best"))||0}catch(e){}bsEl.textContent=best;
function size(){W=box.clientWidth;H=box.clientHeight;c.width=W;c.height=H;cs=Math.floor(Math.min(W*0.62/COLS,H/ROWS));ox=Math.floor((W-cs*COLS)/2)-Math.floor(cs*1.6);oy=Math.floor((H-cs*ROWS)/2);if(ox<2)ox=2}
function rnd(){if(!bag.length){bag=[0,1,2,3,4,5,6];for(let i=6;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
function mk(t){return{t,c:SH[t].map(p=>[p[0],p[1]]),x:3,y:0}}
function cells(p,dx=0,dy=0,cc=p.c){return cc.map(q=>[q[0]+p.x+dx,q[1]+p.y+dy])}
function ok(p,dx=0,dy=0,cc=p.c){return cells(p,dx,dy,cc).every(([a,b])=>a>=0&&a<COLS&&b<ROWS&&(b<0||!g[b][a]))}
function rot(p){if(p.t===1)return;const n=p.t===0?4:3;const cc=p.c.map(([a,b])=>[n-1-b,a]);for(const k of[0,-1,1,-2,2])if(ok(p,k,0,cc)){p.c=cc;p.x+=k;return}}
function spawn(){cur=nxt||mk(rnd());nxt=mk(rnd());if(!ok(cur)){end()}}
function lock(){for(const[a,b]of cells(cur)){if(b>=0)g[b][a]=cur.t+1}let n=0;for(let r=ROWS-1;r>=0;r--){if(g[r].every(v=>v)){g.splice(r,1);g.unshift(Array(COLS).fill(0));n++;r++}}
if(n){lines+=n;score+=[0,100,300,500,800][n]*level;level=1+Math.floor(lines/10);msg.textContent=["","SINGLE","DOUBLE","TRIPLE","TETRIS!"][n]}else score+=2;hud();spawn()}
function hud(){scEl.textContent=score;lnEl.textContent=lines;lvEl.textContent=level}
function mv(dx){if(alive&&ok(cur,dx,0)){cur.x+=dx;draw()}}
function soft(){if(!alive)return;if(ok(cur,0,1)){cur.y++;score+=1;hud()}else lock();draw()}
function hard(){if(!alive)return;let n=0;while(ok(cur,0,1)){cur.y++;n++}score+=n*2;hud();lock();draw()}
function rotate(){if(alive){rot(cur);draw()}}
function end(){alive=false;if(score>best){best=score;try{localStorage.setItem("tetris_best",best)}catch(e){}bsEl.textContent=best}fs.textContent="SCORE "+score;over.classList.add("on")}
function start(){g=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;lines=0;level=1;bag=[];nxt=null;hud();over.classList.remove("on");msg.textContent="GOOD LUCK!";alive=true;spawn();last=performance.now();drop=0;draw()}
function cell(px,py,col,a=1){x.globalAlpha=a;x.fillStyle=col;x.fillRect(px+1,py+1,cs-2,cs-2);x.fillStyle="rgba(255,255,255,.28)";x.fillRect(px+1,py+1,cs-2,3);x.globalAlpha=1}
function draw(){x.clearRect(0,0,W,H);x.fillStyle="#0b0b1c";x.fillRect(ox,oy,cs*COLS,cs*ROWS);x.strokeStyle="rgba(255,255,255,.05)";for(let i=0;i<=COLS;i++){x.beginPath();x.moveTo(ox+i*cs,oy);x.lineTo(ox+i*cs,oy+ROWS*cs);x.stroke()}for(let i=0;i<=ROWS;i++){x.beginPath();x.moveTo(ox,oy+i*cs);x.lineTo(ox+COLS*cs,oy+i*cs);x.stroke()}
for(let r=0;r<ROWS;r++)for(let a=0;a<COLS;a++)if(g&&g[r][a])cell(ox+a*cs,oy+r*cs,COL[g[r][a]-1]);
if(cur&&alive){let gy=0;while(ok(cur,0,gy+1))gy++;for(const[a,b]of cells(cur,0,gy))if(b>=0)cell(ox+a*cs,oy+b*cs,COL[cur.t],.22);for(const[a,b]of cells(cur))if(b>=0)cell(ox+a*cs,oy+b*cs,COL[cur.t])}
const px=ox+COLS*cs+Math.floor(cs*.7);x.fillStyle="#e1bee7";x.font="bold 11px monospace";x.fillText("NEXT",px,oy+12);if(nxt)for(const[a,b]of nxt.c)cell(px+a*(cs*.8),oy+22+b*(cs*.8),COL[nxt.t]) }
function loop(t){if(alive){const sp=Math.max(80,800-(level-1)*70);drop+=t-last;if(drop>=sp){drop=0;if(ok(cur,0,1))cur.y++;else lock();draw()}}last=t;requestAnimationFrame(loop)}
function press(el,fn){el.addEventListener("pointerdown",e=>{e.preventDefault();fn()})}
function rep(el,fn){let tm,iv;el.addEventListener("pointerdown",e=>{e.preventDefault();fn();tm=setTimeout(()=>{iv=setInterval(fn,70)},260)});const s=()=>{clearTimeout(tm);clearInterval(iv)};["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,s))}
rep($("l"),()=>mv(-1));rep($("r"),()=>mv(1));rep($("d"),soft);press($("rt"),rotate);press($("hd"),hard);press($("rb"),start);
let sx,sy,st;c.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;st=Date.now()});
c.addEventListener("pointerup",e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<12&&Math.abs(dy)<12){rotate();return}if(Math.abs(dx)>Math.abs(dy)){mv(dx>0?1:-1)}else if(dy>0){(dy>60&&Date.now()-st<250)?hard():soft()}});
addEventListener("keydown",e=>{const k=e.key;if(k==="ArrowLeft")mv(-1);else if(k==="ArrowRight")mv(1);else if(k==="ArrowDown")soft();else if(k==="ArrowUp")rotate();else if(k===" ")hard();else return;e.preventDefault()});
size();addEventListener("resize",()=>{size();draw()});g=Array.from({length:ROWS},()=>Array(COLS).fill(0));draw();start();requestAnimationFrame(loop);
})()</script></body></html>
