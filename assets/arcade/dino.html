<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dino Run</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a0f05;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#cab{position:absolute;left:50%;top:50%;width:360px;transform-origin:center;padding:14px 14px 16px;border-radius:30px;background:linear-gradient(160deg,#6b3a0f,#3a1c06 60%,#5a2a0a);box-shadow:0 0 0 4px #ff9f2d,0 0 0 8px #1a0f05,0 0 0 10px #ffd84a,0 0 44px #ff9f2d77}
.led{height:10px;margin:0 6px 10px;background:radial-gradient(circle,#ffd84a 3px,transparent 3.6px) 0 0/16px 10px repeat-x}
.title{border-radius:16px;border:3px solid #ffbe5a;padding:8px 0 9px;text-align:center;font-weight:900;font-size:34px;letter-spacing:4px;background:linear-gradient(180deg,#f08a1c,#a84c0a 60%,#7a3206);text-shadow:0 0 8px #ffd84a,0 2px 0 #000a;box-shadow:inset 0 0 14px #ffbe5a66}
.stats{display:flex;margin:10px 0;border:2px solid #8a4a14;border-radius:12px;background:#1d0e03;overflow:hidden}
.stats div{flex:1;text-align:center;padding:5px 0;border-right:2px solid #4a2408}.stats div:last-child{border:0}
.stats small{display:block;font-size:12px;letter-spacing:1px}.stats b{font:800 24px "Courier New",monospace;color:#ffd84a;text-shadow:0 0 8px #ffd84a}
.field{position:relative;border-radius:16px;padding:5px;background:linear-gradient(135deg,#ff9f2d,#ffd84a)}
canvas{display:block;width:100%;border-radius:12px}
.btns{margin-top:12px;display:flex;gap:8px}.btns button{flex:1;border:0;border-radius:14px;padding:16px 0;color:#2b1500;font:900 22px "Trebuchet MS",sans-serif;background:linear-gradient(180deg,#ffd84a,#f09a10);box-shadow:inset 0 3px 0 #fff8,0 4px 0 #7a4a00}
.btns button:active{transform:translateY(2px);filter:brightness(1.1)}
#ov{position:absolute;inset:5px;border-radius:12px;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#ov h1{margin:0;font-size:32px}#ov p{margin:0;font-size:20px;font-weight:700}
.go{background:#ffd84a;color:#2b1500;border:0;border-radius:14px;padding:14px 30px;font:900 20px "Trebuchet MS",sans-serif}
</style></head><body>
<div id="cab"><div class="led"></div><div class="title">🦖 DINO RUN</div>
  <div class="stats"><div><small>SCORE</small><b id="s">0</b></div><div><small>SPEED</small><b id="sp">6</b></div><div><small>BEST</small><b id="b">0</b></div></div>
  <div class="field"><canvas id="c" width="320" height="200"></canvas><div id="ov"><h1>GAME OVER</h1><p id="fs"></p><button class="go" id="go">PLAY AGAIN</button></div></div>
  <div class="btns"><button id="j">⬆ JUMP</button><button id="dk">⬇ DUCK</button></div>
</div>
<script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),W=320,H=200,GY=150,cab=$('cab');
function fit(){const s=Math.min(innerWidth/384,innerHeight/(cab.offsetHeight+16),1.5);cab.style.transform='translate(-50%,-50%) scale('+s+')'}addEventListener('resize',fit);fit();
let best=0;try{best=+localStorage.getItem('dn_best')||0}catch(e){}$('b').textContent=best;
let AC;function beep(f,d,ty){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
let y,vy,obs,t,score,sp,over,duck,deadAt,started;
function reset(){y=GY;vy=0;obs=[];t=0;score=0;sp=5;over=false;duck=false;started=false;step.n=30;$('s').textContent=0;$('ov').style.display='none'}
function jump(){if(over)return;started=true;if(y>=GY){vy=-11.5;beep(600,.08)}}
c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('j').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function dk(v){return e=>{e.preventDefault();duck=v}}$('dk').addEventListener('pointerdown',dk(true));$('dk').addEventListener('pointerup',dk(false));$('dk').addEventListener('pointerleave',dk(false));
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}if(e.key==='ArrowDown')duck=true});addEventListener('keyup',e=>{if(e.key==='ArrowDown')duck=false});
$('go').addEventListener('click',()=>{if(Date.now()-deadAt>300)reset()});
function die(){over=true;deadAt=Date.now();beep(120,.5,'sawtooth');const sc=Math.floor(score);if(sc>best){best=sc;try{localStorage.setItem('dn_best',best)}catch(e){}}$('b').textContent=best;$('fs').textContent='Score '+sc+' · Best '+best;$('ov').style.display='flex'}
function step(){if(over||!started)return;t++;sp=5+Math.min(6,t/550);score+=sp/10;$('s').textContent=Math.floor(score);$('sp').textContent=sp.toFixed(1);
  vy+=.62;y+=vy;if(y>GY){y=GY;vy=0}
  if(--step.n<=0){const bird=score>120&&Math.random()<.3;obs.push(bird?{x:W,w:32,h:22,y:GY-44-(Math.random()<.5?0:16),b:1}:{x:W,w:16+Math.random()*18,h:28+Math.random()*24,y:GY,b:0});step.n=Math.max(36,86-t/30)+Math.random()*36}
  const ducking=duck&&y>=GY,dw=ducking?40:26,dh=ducking?22:40,dx=50;
  for(const o of obs){o.x-=sp;const top=o.b?o.y:GY-o.h,bot=o.b?o.y+o.h:GY;if(dx+dw-5>o.x&&dx+5<o.x+o.w&&y-dh+4<bot&&y>top)die()}
  obs=obs.filter(o=>o.x>-50)}
step.n=30;
function draw(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe9b8');g.addColorStop(1,'#fff6df');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';for(const[cx,cy]of[[60,40],[200,28],[290,56]]){x.beginPath();x.arc(cx-(t*.3%360),cy,14,0,7);x.arc(cx+14-(t*.3%360),cy+3,11,0,7);x.fill()}
  x.fillStyle='#8a5a2a';x.fillRect(0,GY,W,3);x.fillStyle='#c9a46b';x.fillRect(0,GY+3,W,H-GY);for(let i=0;i<14;i++)x.fillRect((i*47-(t*sp*.5)%47+W)%W,GY+14+(i%3)*10,10,2);
  const ducking=duck&&y>=GY,dh=ducking?22:40,dw=ducking?40:26;x.fillStyle='#3d7a2a';x.fillRect(50,y-dh,dw,dh);if(!ducking){x.fillRect(62,y-dh-11,20,15);x.fillStyle='#fff';x.fillRect(74,y-dh-8,4,4);x.fillStyle='#2b5a1c';x.fillRect(50,y-dh+12,-8,6)}x.fillStyle='#2b5a1c';x.fillRect(52+((t>>3)&1?3:14),y,8,6);
  for(const o of obs){x.fillStyle='#2f6b22';if(o.b){x.fillRect(o.x,o.y+7,o.w,9);x.fillRect(o.x+7,o.y+((t>>3)&1?0:12),12,7)}else{x.fillRect(o.x+o.w/2-4,GY-o.h,8,o.h);x.fillRect(o.x,GY-o.h*.7,o.w/2,5);x.fillRect(o.x+o.w/2,GY-o.h*.5,o.w/2,5)}}
  if(!started){x.fillStyle='#000a';x.fillRect(80,66,160,40);x.fillStyle='#fff';x.font='bold 18px Trebuchet MS, system-ui, sans-serif';x.textAlign='center';x.fillText('TAP JUMP TO START',160,92)}}
reset();(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>
