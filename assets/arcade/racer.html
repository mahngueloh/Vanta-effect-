<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Turbo Highway</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b141a;color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}canvas{display:block;border-radius:16px;box-shadow:0 0 0 4px #1f2c34,0 10px 40px #0008}.hud{display:flex;gap:10px;font-weight:700;font-size:14px;letter-spacing:.5px}.pill{background:#1f2c34;padding:6px 12px;border-radius:999px}.btn{background:#00e5ff;color:#001;border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:800}.ctl{display:flex;gap:10px;width:min(92vw,360px)}.ctl button{flex:1;padding:16px 0;border:0;border-radius:14px;background:#1f2c34;color:#fff;font-size:18px;font-weight:800}.ctl button:active{background:#00a884}#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#000a;text-align:center}#ov h1{margin:0;font-size:34px}#ov p{margin:0;font-size:20px}</style></head><body><div id="wrap"><div class="hud"><span class="pill">🏎️ TURBO HIGHWAY</span><span class="pill">SCORE <b id="s">0</b></span><span class="pill">🏆 <b id="b">0</b></span></div><canvas id="c" width="360" height="520"></canvas><div class="ctl"><button id="L">◀ LEFT</button><button id="Bo" style="background:#a4122f">▲ BOOST</button><button id="R">RIGHT ▶</button></div></div><div id="ov"><h1>CRASHED!</h1><p id="fs"></p><button class="btn" id="go">RACE AGAIN</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=520,RX=40,RW=280,LW=RW/3;
function fit(){const h=Math.min(innerHeight-200,innerWidth*520/360);c.style.height=h+'px';c.style.width=h*360/520+'px'}fit();addEventListener('resize',fit);
let best=0;try{best=+localStorage.getItem('tr_best')||0}catch(e){}
const S=document.getElementById('s'),B=document.getElementById('b'),OV=document.getElementById('ov');B.textContent=best;
let lane,px,cars,t,score,speed,boost,over,off,spawn;
function reset(){lane=1;px=RX+LW*1.5;cars=[];t=0;score=0;speed=4;boost=false;over=false;off=0;spawn=40;S.textContent=0;OV.style.display='none'}
function move(d){if(over)return;lane=Math.max(0,Math.min(2,lane+d))}
function press(id,fn,up){const e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();fn()});if(up)e.addEventListener('pointerup',up),e.addEventListener('pointerleave',up)}
press('L',()=>move(-1));press('R',()=>move(1));press('Bo',()=>boost=true,()=>boost=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')boost=true});addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key===' ')boost=false});
let sx=0;c.addEventListener('pointerdown',e=>sx=e.clientX);c.addEventListener('pointerup',e=>{const d=e.clientX-sx;if(Math.abs(d)>20)move(d>0?1:-1)});
document.getElementById('go').addEventListener('click',reset);
function die(){over=true;if(score>best){best=score;try{localStorage.setItem('tr_best',best)}catch(e){}}B.textContent=best;document.getElementById('fs').textContent='Final Score: '+score;OV.style.display='flex'}
function car(cx,cy,col,pl){x.fillStyle=col;x.beginPath();x.roundRect(cx-17,cy-30,34,60,8);x.fill();x.fillStyle='#0009';x.fillRect(cx-12,cy-14,24,14);x.fillRect(cx-12,cy+10,24,8);if(pl){x.fillStyle='#fff';x.fillRect(cx-14,cy-30,6,5);x.fillRect(cx+8,cy-30,6,5)}}
function step(){
  if(over)return;t++;const sp=speed+(boost?3.5:0);off=(off+sp)%60;
  const tx=RX+LW*(lane+.5);px+=(tx-px)*.28;
  speed=4+Math.min(6,t/900);score+=Math.round(sp/4);S.textContent=score;
  if(--spawn<=0){const l=Math.floor(Math.random()*3);cars.push({l,y:-40,c:['#ff3d71','#ffb300','#7c4dff','#00c853'][Math.floor(Math.random()*4)]});spawn=Math.max(22,60-t/40)*(4/ sp)*1.4}
  for(const e of cars){e.y+=sp*.9;const ex=RX+LW*(e.l+.5);if(Math.abs(ex-px)<30&&Math.abs(e.y-(H-90))<52)die()}
  cars=cars.filter(e=>e.y<H+60);
}
function draw(){
  x.fillStyle='#0c0a1a';x.fillRect(0,0,W,H);x.fillStyle='#1a1530';x.fillRect(0,0,RX,H);x.fillRect(RX+RW,0,RX,H);
  x.fillStyle='#262237';x.fillRect(RX,0,RW,H);x.fillStyle='#ff2d95';x.fillRect(RX-4,0,4,H);x.fillRect(RX+RW,0,4,H);
  x.fillStyle='#fff6';for(let l=1;l<3;l++)for(let i=-60;i<H;i+=60)x.fillRect(RX+LW*l-2,i+off,4,30);
  for(const e of cars)car(RX+LW*(e.l+.5),e.y,e.c,false);car(px,H-90,boost?'#00e5ff':'#18ffff',true);
  if(boost&&!over){x.fillStyle='#ff9100';x.beginPath();x.moveTo(px-8,H-58);x.lineTo(px,H-30+Math.random()*14);x.lineTo(px+8,H-58);x.fill()}
}
reset();(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>
